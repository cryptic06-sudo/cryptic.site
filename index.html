<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>cryptic.site — Deriv Digit Intelligence</title>
  <style>
    :root {
      --bg: #080b10;
      --card: #111722;
      --line: #273142;
      --txt: #edf2f7;
      --muted: #8c99aa;
      --accent: #7c5cff;
      --good: #35c46a;
      --warn: #e5ad35;
      --bad: #f05b6f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #15112a, #080b10 42%);
      color: var(--txt);
      font-family: Inter, system-ui, sans-serif;
    }
    .wrap { max-width: 1180px; margin: auto; padding: 22px; }
    .top { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .brand { font-size: 28px; font-weight: 900; letter-spacing: -1px; }
    .brand span { color: #9b86ff; }
    .card {
      background: rgba(17, 23, 34, .94);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      margin: 13px 0;
      box-shadow: 0 8px 30px #0004;
    }
    .muted { color: var(--muted); }
    button, select {
      border: 1px solid var(--line);
      background: #1b2330;
      color: #fff;
      border-radius: 9px;
      padding: 10px 13px;
      font-weight: 750;
      margin: 3px;
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); }
    .statusline { margin-top: 15px; font-weight: bold; }
  </style>
</head>
